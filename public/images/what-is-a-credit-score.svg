      <path d="M141 -141 A200 200 0 0 1 200 0" stroke="#14876a"/>
    </g>
    <line x1="600" y1="430" x2="725" y2="320" stroke="#13202b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="600" cy="430" r="24" fill="#13202b"/>
    <rect x="530" y="470" width="140" height="34" rx="17" fill="#e5f1ec"/>
