<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Credit score gauge">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20313f"/><stop offset="1" stop-color="#2f4a5e"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.18"/></pattern>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1a24" flood-opacity="0.22"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#dots)"/>
<circle cx="1040" cy="110" r="220" fill="#ffffff" fill-opacity="0.07"/>
<circle cx="140" cy="600" r="260" fill="#ffffff" fill-opacity="0.06"/>

    <rect x="320" y="140" width="560" height="400" rx="22" fill="#ffffff" filter="url(#sh)"/>
